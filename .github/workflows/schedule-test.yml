name: Schedule test (temporary)

# Tymczasowy workflow diagnostyczny: sprawdza, czy zdarzenie "schedule"
# w ogóle odpala się w tym repozytorium. Do usunięcia po teście.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print time and event
        run: |
          echo "event:  ${{ github.event_name }}"
          echo "now:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
